[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinuv"
version = "0.1.0.dev0"
description = "Visibility-plane kinematic models for KILOGAS (KGAS066 first)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
nufft = ["jax>=0.4.30", "jax-finufft>=1.3"]
io = ["astropy>=5.0"]
plot = ["matplotlib>=3.8", "astropy>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "ignore:.*obsfix.*:astropy.wcs.wcs.FITSFixedWarning",
]
